    <title>GetFitNow Event — Gestion & Réservation Coaching Sportif</title>

    <meta property="og:title" content="GetFitNow Event — Gestion & Réservation Coaching Sportif" />
    <meta property="og:description" content="GetFitNow Event : plateforme de gestion d'événements sportifs, carte de localisation, recherche par ville et région, réservations gratuites avec clôture 1h avant le début et suivi des adhérents." />

    <script>
      (function () {
        try {
          var stored = localStorage.getItem('getfitnow-theme');
          var isDark =
            stored === 'dark' ||
            (!stored &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.classList.toggle('dark', isDark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-emerald-600 selection:text-white dark:bg-slate-950 dark:text-slate-100">

    <script type="module" src="/src/main.tsx"></script>
  </body>
